name: opendesk
services:
  app:
    build: .
    image: opendesk:local
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/index.php')===false?1:0);"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    image: opendesk:local
    env_file: .env
    command: ["sh", "-c", "while true; do php index.php --escalate; sleep 300; done"]
    depends_on:
      app:
        condition: service_healthy
  mongo:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  seed:
    image: mongo:7.0
    profiles: [tools]
    env_file: .env
    volumes:
      - ./scripts/seed-mongosh.js:/seed/seed-mongosh.js:ro
    command: ["mongosh", "--quiet", "--nodb", "--file", "/seed/seed-mongosh.js"]
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo_data:
